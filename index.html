<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MINDCENTER - Interaktiv ta'lim platformasi. O'ynab o'rganing!">
    <title>MINDCENTER - Interaktiv Ta'lim</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icons
        const Star = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
        const Zap = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
        const ShoppingBag = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>;
        const User = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const Map = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>;
        const Lock = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
        const CheckCircle = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const XCircle = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>;
        const LogOut = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
        const TrendingUp = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
        const Brain = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>;
        const Battery = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="1" y="6" width="18" height="12" rx="2" ry="2"/><line x1="23" y1="13" x2="23" y2="11"/></svg>;
        const Send = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>;

        const App = () => {
          const [st, setSt] = useState('login');
          const [f, setF] = useState({ u: '', p: '', p2: '', a: '' });
          const [reg, setReg] = useState(false);
          const [pl, setPl] = useState(null);
          const [bd, setBd] = useState([]);
          const [sb, setSb] = useState(null);
          const [lv, setLv] = useState(null);
          const [qi, setQi] = useState(0);
          const [q, setQ] = useState([]);
          const [an, setAn] = useState([]);
          const [ac, setAc] = useState(false);
          const [fb, setFb] = useState('');
          const [ms, setMs] = useState('');
          const [err, setErr] = useState('');

          const subs = {
            math: { n: 'Matematika', e: '🧮', c: '#3b82f6' },
            eng: { n: 'Ingliz', e: '📚', c: '#10b981' },
            sci: { n: 'Fan', e: '🔬', c: '#a855f7' },
            log: { n: 'Mantiq', e: '🧩', c: '#f97316' }
          };

          const avs = {
            n: { n: 'Ninja', e: '🥷', c: '#475569' },
            w: { n: 'Sehrgar', e: '🧙‍♂️', c: '#9333ea', p: 500 },
            r: { n: 'Robot', e: '🤖', c: '#0ea5e9', p: 800 },
            a: { n: 'Alien', e: '👽', c: '#10b981', p: 1000 }
          };

          useEffect(() => {
            if (pl) {
              const u = JSON.parse(localStorage.getItem('mc') || '{}');
              u[pl.u] = pl;
              localStorage.setItem('mc', JSON.stringify(u));
              const b = Object.entries(u).map(([k, v]) => ({u:k,n:v.n,x:v.x,l:v.l})).sort((a,b)=>b.x-a.x).slice(0,10);
              setBd(b);
            }
          }, [pl]);

          useEffect(() => {
            const u = JSON.parse(localStorage.getItem('mc') || '{}');
            const b = Object.entries(u).map(([k, v]) => ({u:k,n:v.n,x:v.x,l:v.l})).sort((a,b)=>b.x-a.x).slice(0,10);
            setBd(b);
          }, []);

          const msg = (t) => { setMs(t); setTimeout(() => setMs(''), 3000); };

          const login = () => {
            setErr('');
            if (!f.u || !f.p) { setErr('Barcha maydonlarni toldiring!'); return; }
            const u = JSON.parse(localStorage.getItem('mc') || '{}');
            if (u[f.u] && u[f.u].p === f.p) { 
              setPl(u[f.u]); setSt('map'); msg('Xush kelibsiz!'); setF({u:'',p:'',p2:'',a:''});
            } else setErr('Notogri username yoki parol!');
          };

          const register = () => {
            setErr('');
            if (!f.u || !f.p || !f.p2 || !f.a) { setErr('Barcha maydonlarni toldiring!'); return; }
            const u = JSON.parse(localStorage.getItem('mc') || '{}');
            if (u[f.u]) { setErr('Username band!'); return; }
            if (f.p.length < 6) { setErr('Parol kamida 6 ta belgidan iborat bolishi kerak!'); return; }
            if (f.p !== f.p2) { setErr('Parollar mos kelmadi!'); return; }
            if (f.a < 5 || f.a > 100) { setErr('Yoshni togri kiriting!'); return; }
            const np = {u:f.u,p:f.p,n:f.u,a:f.a,c:0,x:0,l:1,e:100,sk:['n'],s:'n',d:[]};
            u[f.u] = np;
            localStorage.setItem('mc', JSON.stringify(u));
            setPl(np); setSt('map'); msg('Royxatdan otdingiz!'); setF({u:'',p:'',p2:'',a:''});
          };

          const genQ = (sub) => {
            const qs = [];
            for (let i = 0; i < 5; i++) {
              if (sub === 'math') {
                const ops = ['+','-','×'];
                const op = ops[Math.floor(Math.random()*3)];
                let n1 = Math.floor(Math.random()*50)+1;
                let n2 = Math.floor(Math.random()*50)+1;
                if (op === '-' && n1 < n2) [n1,n2] = [n2,n1];
                const a = op==='+'?n1+n2:op==='-'?n1-n2:n1*n2;
                const o = [a, a+5, a-3, a+7].filter(x=>x>0).slice(0,4).sort(()=>Math.random()-0.5);
                qs.push({q:n1+' '+op+' '+n2+' = ?', a, o});
              } else if (sub === 'eng') {
                const w = [{w:'apple',t:'olma'},{w:'book',t:'kitob'},{w:'cat',t:'mushuk'},{w:'happy',t:'baxtli'},{w:'water',t:'suv'}];
                const x = w[i];
                qs.push({q:x.w+' manosi?', a:x.t, o:[x.t,'test','demo','quiz'].sort(()=>Math.random()-0.5)});
              } else if (sub === 'sci') {
                const w = [{q:'Yulduz?',a:'Quyosh'},{q:'Suv?',a:'H2O'},{q:'Sayyora?',a:'Yupiter'},{q:'Osimlik?',a:'Kislorod'},{q:'Mineral?',a:'Olmos'}];
                qs.push({q:w[i].q, a:w[i].a, o:[w[i].a,'test','demo','quiz'].sort(()=>Math.random()-0.5)});
              } else {
                const w = [{q:'2,4,6,8,?',a:'10'},{q:'1,1,2,3,5,?',a:'8'},{q:'5,10,20,?',a:'40'},{q:'Uchburchak?',a:'3'},{q:'100,90,?',a:'80'}];
                qs.push({q:w[i].q, a:w[i].a, o:[w[i].a,'test','demo','quiz'].sort(()=>Math.random()-0.5)});
              }
            }
            return qs;
          };

          const start = (s, l) => {
            if (pl.e < 10) { msg('Energiya yoq!'); return; }
            setQ(genQ(s)); setAn([]); setQi(0); setSb(s); setLv(l); setAc(true); setFb('');
            setPl({...pl, e: pl.e - 10});
          };

          const check = (sel) => {
            const c = q[qi];
            const cor = sel === c.a;
            const na = [...an, {q:c.q,u:sel,a:c.a,cor}];
            setAn(na);
            setFb(cor ? '✅ Togri!' : '❌ Xato: ' + c.a);
            if (!cor) setPl(p => ({...p, x: Math.max(0, p.x - Math.floor(p.x*0.02))}));
            setTimeout(() => {
              if (qi < 4) { setQi(qi+1); setFb(''); }
              else {
                const cnt = na.filter(x=>x.cor).length;
                const nx = pl.x + cnt*50 + lv*20;
                const nl = Math.floor(nx/100)+1;
                const up = nl > pl.l;
                setPl(p => ({...p, c:p.c+cnt*50+(up?200:0), x:nx, l:nl, e:Math.min(p.e+5,100), d:[...p.d,sb+'-'+lv]}));
                if (up) msg('Level Up! +200 coin!');
                setAc(false); setSt('result');
              }
            }, 1500);
          };

          if (st === 'login') {
            return (
              <div className="min-h-screen flex items-center justify-center p-4" style={{background:'linear-gradient(135deg,#667eea,#764ba2)'}}>
                <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full">
                  <div className="text-center mb-8">
                    <div className="text-7xl mb-4">🧠</div>
                    <h1 className="text-5xl font-black mb-2" style={{color:'#667eea'}}>MINDCENTER</h1>
                    <p className="text-gray-600 font-semibold">Aqlingizni rivojlantiring!</p>
                  </div>
                  <div className="space-y-4">
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-2">Username</label>
                      <input type="text" placeholder="Foydalanuvchi nomi" className="w-full px-4 py-3 rounded-xl border-2 border-gray-300 focus:border-purple-500 focus:outline-none text-lg"
                        value={f.u} onChange={(e) => setF({...f, u: e.target.value})} />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-2">Parol {reg && '(kamida 6 belgi)'}</label>
                      <input type="password" placeholder="Parol" className="w-full px-4 py-3 rounded-xl border-2 border-gray-300 focus:border-purple-500 focus:outline-none text-lg"
                        value={f.p} onChange={(e) => setF({...f, p: e.target.value})} />
                    </div>
                    {reg && (
                      <>
                        <div>
                          <label className="block text-sm font-bold text-gray-700 mb-2">Parolni takrorlang</label>
                          <input type="password" placeholder="Qayta kiriting" className="w-full px-4 py-3 rounded-xl border-2 border-gray-300 focus:border-purple-500 focus:outline-none text-lg"
                            value={f.p2} onChange={(e) => setF({...f, p2: e.target.value})} />
                        </div>
                        <div>
                          <label className="block text-sm font-bold text-gray-700 mb-2">Yosh (5-100)</label>
                          <input type="number" placeholder="Yoshingiz" className="w-full px-4 py-3 rounded-xl border-2 border-gray-300 focus:border-purple-500 focus:outline-none text-lg"
                            value={f.a} onChange={(e) => setF({...f, a: e.target.value})} />
                        </div>
                      </>
                    )}
                    {err && <div className="bg-red-100 border-2 border-red-400 text-red-700 px-4 py-3 rounded-xl font-semibold text-center">{err}</div>}
                    {reg ? (
                      <div className="space-y-3">
                        <button onClick={register} className="w-full py-4 rounded-xl font-bold text-xl text-white hover:scale-105 transition shadow-lg" style={{background:'linear-gradient(135deg,#10b981,#059669)'}}>Royxat</button>
                        <button onClick={() => {setReg(false); setErr(''); setF({u:'',p:'',p2:'',a:''});}} className="w-full bg-gray-200 text-gray-700 py-4 rounded-xl font-bold hover:bg-gray-300 transition">Orqaga</button>
                      </div>
                    ) : (
                      <div className="space-y-3">
                        <button onClick={login} className="w-full py-4 rounded-xl font-bold text-xl text-white hover:scale-105 transition shadow-lg" style={{background:'linear-gradient(135deg,#667eea,#764ba2)'}}>Kirish</button>
                        <button onClick={() => {setReg(true); setErr(''); setF({u:'',p:'',p2:'',a:''});}} className="w-full bg-gray-200 text-gray-700 py-4 rounded-xl font-bold hover:bg-gray-300 transition">Yangi akkaunt</button>
                      </div>
                    )}
                  </div>
                  {bd.length > 0 && (
                    <div className="mt-8">
                      <h3 className="text-xl font-bold text-center mb-4" style={{color:'#667eea'}}>🏆 Top</h3>
                      {bd.slice(0,3).map((u, i) => (
                        <div key={i} className="flex justify-between bg-gray-50 p-3 rounded-xl mb-2 border border-gray-200">
                          <span className="font-semibold flex gap-2"><span className="text-2xl">{i===0?'🥇':i===1?'🥈':'🥉'}</span>{u.n}</span>
                          <span className="font-bold px-3 py-1 rounded-lg text-sm text-white" style={{background:'#667eea'}}>Lvl {u.l}</span>
                        </div>
                      ))}
                    </div>
                  )}
                  <div className="mt-6 text-center">
                    <a href="https://t.me/MathTeacher_web" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 text-gray-600 hover:text-purple-600 font-semibold transition">
                      <Send size={20} /> @MathTeacher_web
                    </a>
                  </div>
                </div>
                {ms && <div className="fixed top-8 right-8 bg-white text-gray-800 px-6 py-4 rounded-2xl font-bold shadow-2xl border-2 z-50 animate-bounce" style={{borderColor:'#667eea'}}>{ms}</div>}
              </div>
            );
          }

          if (!pl) return null;
          const av = avs[pl.s];

          if (st === 'result') {
            const cnt = an.filter(x=>x.cor).length;
            return (
              <div className="min-h-screen flex items-center justify-center p-4" style={{background:'linear-gradient(135deg,#667eea,#764ba2)'}}>
                <div className="max-w-3xl w-full bg-white rounded-3xl p-10 text-center shadow-2xl">
                  <div className="text-9xl mb-8">{cnt>=4?'🎉':'😊'}</div>
                  <h2 className="text-6xl font-black mb-8" style={{color:'#667eea'}}>{cnt>=4?'Ajoyib!':'Yaxshi!'}</h2>
                  <div className="grid grid-cols-3 gap-6 mb-10">
                    <div className="bg-green-100 p-6 rounded-3xl border-2 border-green-500"><div className="text-5xl font-black text-green-600">{cnt}</div><div className="text-green-700 font-bold">Togri</div></div>
                    <div className="bg-yellow-100 p-6 rounded-3xl border-2 border-yellow-500"><div className="text-5xl font-black text-yellow-600">+{cnt*50}</div><div className="text-yellow-700 font-bold">Coins</div></div>
                    <div className="bg-blue-100 p-6 rounded-3xl border-2 border-blue-500"><div className="text-5xl font-black text-blue-600">+{cnt*50}</div><div className="text-blue-700 font-bold">XP</div></div>
                  </div>
                  <button onClick={() => setSt('map')} className="text-white px-16 py-5 rounded-full text-3xl font-black hover:scale-110 transition shadow-2xl" style={{background:'linear-gradient(135deg,#10b981,#059669)'}}>Davom 🚀</button>
                </div>
              </div>
            );
          }

          if (ac && q.length > 0) {
            const c = q[qi];
            return (
              <div className="min-h-screen flex items-center justify-center p-4" style={{background:'linear-gradient(135deg,#667eea,#764ba2)'}}>
                <div className="max-w-4xl w-full bg-white rounded-3xl p-8 shadow-2xl">
                  <div className="flex justify-between mb-6">
                    <div className="font-bold text-3xl flex items-center gap-3" style={{color:'#667eea'}}><Brain className="animate-pulse" /> S {qi+1}/5</div>
                    <div className="flex gap-3">
                      {[0,1,2,3,4].map(i => (
                        <div key={i} className={'w-14 h-14 rounded-2xl flex items-center justify-center font-bold text-xl border-2 '+(i<qi?(an[i]?.cor?'bg-green-500 border-green-600':'bg-red-500 border-red-600')+' text-white':i===qi?'bg-yellow-400 border-yellow-500 text-black':'bg-gray-200 border-gray-300 text-gray-500')}>{i+1}</div>
                      ))}
                    </div>
                  </div>
                  <div className="text-center mb-10 p-10 rounded-3xl shadow-xl text-white" style={{backgroundColor:subs[sb].c}}>
                    <div className="text-8xl mb-6">{subs[sb].e}</div>
                    <div className="font-bold text-2xl mb-6">Level {lv}</div>
                    <div className="text-4xl font-black">{c.q}</div>
                  </div>
                  <div className="grid grid-cols-2 gap-6 mb-8">
                    {c.o.map((opt, i) => (
                      <button key={i} onClick={() => check(opt)} disabled={fb !== ''}
                        className="px-10 py-10 rounded-3xl text-4xl font-black text-white hover:scale-110 transition disabled:opacity-50 shadow-xl border-4 border-white"
                        style={{background:'linear-gradient(135deg,#8b5cf6,#6366f1)'}}>
                        {opt}
                      </button>
                    ))}
                  </div>
                  {fb && <div className={'text-center text-2xl font-black p-6 rounded-3xl border-4 '+(fb.includes('✅')?'bg-green-100 text-green-700 border-green-500':'bg-red-100 text-red-700 border-red-500')}>{fb}</div>}
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen" style={{background:'linear-gradient(135deg,#667eea,#764ba2)'}}>
              <div className="bg-white bg-opacity-20 p-4">
                <div className="max-w-7xl mx-auto flex justify-between items-center flex-wrap gap-4">
                  <div className="flex items-center gap-4">
                    <div className="text-5xl p-4 rounded-2xl" style={{backgroundColor:av.c}}>{av.e}</div>
                    <div><div className="text-white font-bold text-2xl">{pl.n}</div><div className="text-yellow-300 text-lg font-semibold">Lvl {pl.l}</div></div>
                  </div>
                  <div className="flex gap-4">
                    <div className="flex items-center gap-2 bg-white bg-opacity-30 px-5 py-3 rounded-full"><Star className="text-yellow-300" size={24} /><span className="text-white font-bold text-xl">{pl.c}</span></div>
                    <div className="flex items-center gap-2 bg-white bg-opacity-30 px-5 py-3 rounded-full"><Zap className="text-blue-300" size={24} /><span className="text-white font-bold text-xl">{pl.x}</span></div>
                    <div className="flex items-center gap-2 bg-white bg-opacity-30 px-5 py-3 rounded-full"><Battery className="text-green-300" size={24} /><span className="text-white font-bold text-xl">{pl.e}</span></div>
                    <button onClick={() => {setPl(null);setSt('login');setF({u:'',p:'',p2:'',a:''});}} className="bg-red-500 bg-opacity-80 p-3 rounded-full hover:scale-110 transition"><LogOut className="text-white" size={24} /></button>
                  </div>
                </div>
              </div>

              <div className="bg-white bg-opacity-10 p-4">
                <div className="max-w-7xl mx-auto flex justify-center gap-4 flex-wrap">
                  {[{s:'map',i:<Map/>,t:'Map'},{s:'rank',i:<TrendingUp/>,t:'Reyting'},{s:'shop',i:<ShoppingBag/>,t:'Dokon'},{s:'prof',i:<User/>,t:'Profil'}].map(x => (
                    <button key={x.s} onClick={() => setSt(x.s)} className={'flex items-center gap-2 px-8 py-4 rounded-full font-bold text
