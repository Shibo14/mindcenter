<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINDCENTER - Aqlingizni rivojlantiring!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .center {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .text-center { text-align: center; }
        .mb-4 { margin-bottom: 1.5rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mt-4 { margin-top: 1.5rem; }
        .mb-6 { margin-bottom: 2rem; }
        
        h1 {
            font-size: 3rem;
            font-weight: 900;
            color: #667eea;
        }
        
        .emoji-big {
            font-size: 5rem;
        }
        
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: scale(1.05);
        }
        
        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }
        
        .btn-secondary:hover {
            background: #d1d5db;
        }
        
        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
        }
        
        .hidden { display: none; }
        
        .header {
            background: rgba(255,255,255,0.2);
            padding: 16px;
            margin-bottom: 20px;
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .avatar {
            font-size: 3rem;
            padding: 16px;
            border-radius: 16px;
            display: inline-block;
        }
        
        .stats {
            display: flex;
            gap: 12px;
        }
        
        .stat-badge {
            background: rgba(255,255,255,0.3);
            padding: 12px 20px;
            border-radius: 50px;
            color: white;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .nav {
            background: rgba(255,255,255,0.1);
            padding: 16px;
            margin-bottom: 20px;
        }
        
        .nav-buttons {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .nav-btn {
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .nav-btn.active {
            background: white;
            color: #667eea;
        }
        
        .nav-btn:not(.active) {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        .grid {
            display: grid;
            gap: 24px;
        }
        
        .grid-2 {
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }
        
        .grid-4 {
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }
        
        .grid-5 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }
        
        .level-btn {
            aspect-ratio: 1;
            border-radius: 12px;
            font-weight: 700;
            font-size: 18px;
            border: 2px solid;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .level-btn:not(:disabled):hover {
            transform: scale(1.1);
        }
        
        .level-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .message {
            position: fixed;
            top: 32px;
            right: 32px;
            background: white;
            padding: 16px 24px;
            border-radius: 16px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 2px solid #667eea;
            z-index: 1000;
        }
        
        .question-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .option-btn {
            padding: 40px;
            border-radius: 24px;
            font-size: 2rem;
            font-weight: 900;
            color: white;
            border: 4px solid white;
            cursor: pointer;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            transition: all 0.3s;
        }
        
        .option-btn:not(:disabled):hover {
            transform: scale(1.1);
        }
        
        .option-btn:disabled {
            opacity: 0.5;
        }
        
        .progress-dots {
            display: flex;
            gap: 12px;
        }
        
        .progress-dot {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            border: 2px solid;
        }
        
        .result-item {
            padding: 16px;
            border-radius: 12px;
            border: 2px solid;
            margin-bottom: 12px;
        }
        
        .result-correct {
            background: #dcfce7;
            border-color: #22c55e;
        }
        
        .result-wrong {
            background: #fee2e2;
            border-color: #ef4444;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // State
        let state = {
            screen: 'login',
            isReg: false,
            form: { u: '', p: '', p2: '', a: '' },
            player: null,
            board: [],
            subject: null,
            level: null,
            qi: 0,
            questions: [],
            answers: [],
            active: false,
            feedback: '',
            message: '',
            error: ''
        };

        const subs = {
            math: { n: 'Matematika', e: '🧮', c: '#3b82f6' },
            eng: { n: 'Ingliz', e: '📚', c: '#10b981' },
            sci: { n: 'Fan', e: '🔬', c: '#a855f7' },
            log: { n: 'Mantiq', e: '🧩', c: '#f97316' }
        };

        const avs = {
            n: { n: 'Ninja', e: '🥷', c: '#475569' },
            w: { n: 'Sehrgar', e: '🧙‍♂️', c: '#9333ea', p: 500 },
            r: { n: 'Robot', e: '🤖', c: '#0ea5e9', p: 800 },
            a: { n: 'Alien', e: '👽', c: '#10b981', p: 1000 }
        };

        // Helper functions
        function msg(text) {
            state.message = text;
            render();
            setTimeout(() => {
                state.message = '';
                render();
            }, 3000);
        }

        function loadBoard() {
            const users = JSON.parse(localStorage.getItem('mc') || '{}');
            state.board = Object.entries(users)
                .map(([k, v]) => ({ u: k, n: v.n, x: v.x, l: v.l }))
                .sort((a, b) => b.x - a.x)
                .slice(0, 10);
        }

        function savePlayer() {
            if (!state.player) return;
            const users = JSON.parse(localStorage.getItem('mc') || '{}');
            users[state.player.u] = state.player;
            localStorage.setItem('mc', JSON.stringify(users));
            loadBoard();
        }

        function login() {
            state.error = '';
            if (!state.form.u || !state.form.p) {
                state.error = 'Barcha maydonlarni toldiring!';
                render();
                return;
            }
            const users = JSON.parse(localStorage.getItem('mc') || '{}');
            if (users[state.form.u] && users[state.form.u].p === state.form.p) {
                state.player = users[state.form.u];
                state.screen = 'map';
                state.form = { u: '', p: '', p2: '', a: '' };
                msg('Xush kelibsiz!');
            } else {
                state.error = 'Notogri username yoki parol!';
            }
            render();
        }

        function register() {
            state.error = '';
            if (!state.form.u || !state.form.p || !state.form.p2 || !state.form.a) {
                state.error = 'Barcha maydonlarni toldiring!';
                render();
                return;
            }
            const users = JSON.parse(localStorage.getItem('mc') || '{}');
            if (users[state.form.u]) {
                state.error = 'Username band!';
                render();
                return;
            }
            if (state.form.p.length < 6) {
                state.error = 'Parol kamida 6 ta belgidan iborat bolishi kerak!';
                render();
                return;
            }
            if (state.form.p !== state.form.p2) {
                state.error = 'Parollar mos kelmadi!';
                render();
                return;
            }
            if (state.form.a < 5 || state.form.a > 100) {
                state.error = 'Yoshni togri kiriting!';
                render();
                return;
            }
            const newPlayer = {
                u: state.form.u,
                p: state.form.p,
                n: state.form.u,
                a: state.form.a,
                c: 0,
                x: 0,
                l: 1,
                e: 100,
                sk: ['n'],
                s: 'n',
                d: []
            };
            users[state.form.u] = newPlayer;
            localStorage.setItem('mc', JSON.stringify(users));
            state.player = newPlayer;
            state.screen = 'map';
            state.form = { u: '', p: '', p2: '', a: '' };
            msg('Royxatdan otdingiz!');
            render();
        }

        function genQ(sub) {
            const qs = [];
            for (let i = 0; i < 5; i++) {
                if (sub === 'math') {
                    const ops = ['+', '-', '×'];
                    const op = ops[Math.floor(Math.random() * 3)];
                    let n1 = Math.floor(Math.random() * 50) + 1;
                    let n2 = Math.floor(Math.random() * 50) + 1;
                    if (op === '-' && n1 < n2) [n1, n2] = [n2, n1];
                    const a = op === '+' ? n1 + n2 : op === '-' ? n1 - n2 : n1 * n2;
                    const o = [a, a + 5, a - 3, a + 7].filter(x => x > 0).slice(0, 4).sort(() => Math.random() - 0.5);
                    qs.push({ q: `${n1} ${op} ${n2} = ?`, a, o });
                } else if (sub === 'eng') {
                    const w = [
                        { w: 'apple', t: 'olma' },
                        { w: 'book', t: 'kitob' },
                        { w: 'cat', t: 'mushuk' },
                        { w: 'happy', t: 'baxtli' },
                        { w: 'water', t: 'suv' }
                    ];
                    const x = w[i];
                    qs.push({ q: `${x.w} manosi?`, a: x.t, o: [x.t, 'nok', 'qalam', 'it'].sort(() => Math.random() - 0.5) });
                } else if (sub === 'sci') {
                    const w = [
                        { q: 'Yulduz?', a: 'Quyosh' },
                        { q: 'Suv?', a: 'H2O' },
                        { q: 'Sayyora?', a: 'Yupiter' },
                        { q: 'Osimlik?', a: 'Kislorod' },
                        { q: 'Mineral?', a: 'Olmos' }
                    ];
                    qs.push({ q: w[i].q, a: w[i].a, o: [w[i].a, 'javob1', 'javob2', 'javob3'].sort(() => Math.random() - 0.5) });
                } else {
                    const w = [
                        { q: '2,4,6,8,?', a: '10' },
                        { q: '1,1,2,3,5,?', a: '8' },
                        { q: '5,10,20,?', a: '40' },
                        { q: 'Uchburchak?', a: '3' },
                        { q: '100,90,?', a: '80' }
                    ];
                    qs.push({ q: w[i].q, a: w[i].a, o: [w[i].a, '12', '15', '20'].sort(() => Math.random() - 0.5) });
                }
            }
            return qs;
        }

        function start(s, l) {
            if (state.player.e < 10) {
                msg('Energiya yoq!');
                return;
            }
            state.questions = genQ(s);
            state.answers = [];
            state.qi = 0;
            state.subject = s;
            state.level = l;
            state.active = true;
            state.feedback = '';
            state.player.e -= 10;
            savePlayer();
            state.screen = 'quiz';
            render();
        }

        function check(sel) {
            const c = state.questions[state.qi];
            const cor = sel === c.a;
            state.answers.push({ q: c.q, u: sel, a: c.a, cor });
            state.feedback = cor ? '✅ Togri!' : '❌ Xato: ' + c.a;
            
            if (!cor) {
                state.player.x = Math.max(0, state.player.x - Math.floor(state.player.x * 0.02));
            }
            
            render();
            
            setTimeout(() => {
                if (state.qi < 4) {
                    state.qi++;
                    state.feedback = '';
                    render();
                } else {
                    const cnt = state.answers.filter(x => x.cor).length;
                    const nx = state.player.x + cnt * 50 + state.level * 20;
                    const nl = Math.floor(nx / 100) + 1;
                    const up = nl > state.player.l;
                    
                    state.player.c += cnt * 50 + (up ? 200 : 0);
                    state.player.x = nx;
                    state.player.l = nl;
                    state.player.e = Math.min(state.player.e + 5, 100);
                    state.player.d.push(`${state.subject}-${state.level}`);
                    
                    savePlayer();
                    
                    if (up) msg('Level Up! +200 coin!');
                    
                    state.active = false;
                    state.screen = 'result';
                    render();
                }
            }, 1500);
        }

        function buyEnergy() {
            if (state.player.c >= 100) {
                state.player.c -= 100;
                state.player.e = Math.min(state.player.e + 50, 100);
                savePlayer();
                msg('+50 Energiya!');
            } else {
                msg('100 coin kerak!');
            }
        }

        function buyAvatar(id) {
            const av = avs[id];
            if (av.p && state.player.c >= av.p) {
                state.player.c -= av.p;
                state.player.sk.push(id);
                savePlayer();
                msg(av.n + ' olindi!');
            }
        }

        function equipAvatar(id) {
            state.player.s = id;
            savePlayer();
            render();
        }

        function logout() {
            state.player = null;
            state.screen = 'login';
            state.form = { u: '', p: '', p2: '', a: '' };
            render();
        }

        // Render
        function render() {
            const app = document.getElementById('app');
            
            if (state.screen === 'login') {
                app.innerHTML = `
                    <div class="gradient-bg center">
                        <div class="card" style="max-width: 500px; width: 100%;">
                            <div class="text-center mb-4">
                                <div class="emoji-big">🧠</div>
                                <h1>MINDCENTER</h1>
                                <p style="color: #6b7280; font-weight: 600;">Aqlingizni rivojlantiring!</p>
                            </div>
                            <div style="margin-bottom: 16px;">
                                <label>Username</label>
                                <input type="text" id="username" placeholder="Foydalanuvchi nomi" value="${state.form.u}">
                            </div>
                            <div style="margin-bottom: 16px;">
                                <label>Parol ${state.isReg ? '<span style="font-size: 12px;">(kamida 6 ta)</span>' : ''}</label>
                                <input type="password" id="password" placeholder="••••••" value="${state.form.p}">
                            </div>
                            ${state.isReg ? `
                                <div style="margin-bottom: 16px;">
                                    <label>Parolni takrorlang</label>
                                    <input type="password" id="password2" placeholder="••••••" value="${state.form.p2}">
                                </div>
                                <div style="margin-bottom: 16px;">
                                    <label>Yosh (5-100)</label>
                                    <input type="number" id="age" placeholder="Yoshingiz" value="${state.form.a}">
                                </div>
                            ` : ''}
                            ${state.error ? `<div class="error mb-4">${state.error}</div>` : ''}
                            ${state.isReg ? `
                                <button class="btn btn-secondary mb-2" onclick="handleRegister()">Royxatdan otish</button>
                                <button class="btn btn-secondary" onclick="handleToggleReg()">Orqaga</button>
                            ` : `
                                <button class="btn btn-primary mb-2" onclick="handleLogin()">Kirish</button>
                                <button class="btn btn-secondary" onclick="handleToggleReg()">Yangi akkaunt</button>
                            `}
                            ${state.board.length > 0 ? `
                                <div class="mt-4">
                                    <h3 class="text-center" style="color: #6b7280; font-weight: 700; margin-bottom: 16px;">🏆 Top</h3>
                                    ${state.board.slice(0, 3).map((u, i) => `
                                        <div style="display: flex; justify-content: space-between; background: #f9fafb; padding: 12px; border-radius: 12px; margin-bottom: 8px;">
                                            <span style="font-weight: 600;">${i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉'} ${u.n}</span>
                                            <span style="color: #667eea; font-weight: 700;">${u.x} XP (Lvl ${u.l})</span>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
                
                document.getElementById('username').addEventListener('input', (e) => {
                    state.form.u = e.target.value;
                });
                document.getElementById('password').addEventListener('input', (e) => {
                    state.form.p = e.target.value;
                });
                if (state.isReg) {
                    document.getElementById('password2').addEventListener('input', (e) => {
                        state.form.p2 = e.target.value;
                    });
                    document.getElementById('age').addEventListener('input', (e) => {
                        state.form.a = e.target.value;
                    });
                }
            } else if (state.screen === 'quiz') {
                const c = state.questions[state.qi];
                app.innerHTML = `
                    <div class="gradient-bg center">
                        <div class="card" style="max-width: 900px; width: 100%;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
                                <div style="font-weight: 700; font-size: 1.5rem; color: #667eea; display: flex; align-items: center; gap: 12px;">
                                    <span>🧠</span> Savol ${state.qi + 1}/5
                                </div>
                                <div class="progress-dots">
                                    ${[0, 1, 2, 3, 4].map(i => `
                                        <div class="progress-dot" style="
                                            ${i < state.qi ? (state.answers[i]?.cor ? 'background: #22c55e; border-color: #16a34a; color: white;' : 'background: #ef4444; border-color: #dc2626; color: white;') : i === state.qi ? 'background: #fbbf24; border-color: #f59e0b; color: black;' : 'background: #e5e7eb; border-color: #d1d5db; color: #9ca3af;'}
                                        ">${i + 1}</div>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="text-center mb-6" style="padding: 40px; border-radius: 24px; color: white; background-color: ${subs[state.subject].c};">
                                <div style="font-size: 5rem; margin-bottom: 24px;">${subs[state.subject].e}</div>
                                <div style="font-weight: 700; font-size: 1.5rem; margin-bottom: 24px;">Level ${state.level}</div>
                                <div style="font-size: 2rem; font-weight: 900;">${c.q}</div>
                            </div>
                            <div class="question-grid mb-4">
                                ${c.o.map(opt => `
                                    <button class="option-btn" onclick="handleCheck('${opt}')" ${state.feedback ? 'disabled' : ''}>${opt}</button>
                                `).join('')}
                            </div>
                            ${state.feedback ? `
                                <div style="text-align: center; font-size: 1.5rem; font-weight: 900; padding: 24px; border-radius: 24px; border: 4px solid; ${state.feedback.includes('✅') ? 'background: #dcfce7; color: #16a34a; border-color: #22c55e;' : 'background: #fee2e2; color: #dc2626; border-color: #ef4444;'}">${state.feedback}</div>
                            ` : ''}
                        </div>
                    </div>
                `;
            } else if (state.screen === 'result') {
                const correct = state.answers.filter(x => x.cor).length;
                app.innerHTML = `
                    <div class="gradient-bg center">
                        <div class="card" style="max-width: 700px; width: 100%;">
                            <div class="text-center mb-6">
                                <div class="emoji-big">${correct >= 4 ? '🎉' : correct >= 2 ? '😊' : '😔'}</div>
                                <h1>Natija</h1>
                                <p style="color: #6b7280; font-weight: 600; font-size: 1.25rem;">${correct}/5 togri javob</p>
                            </div>
                            <div style="margin-bottom: 32px;">
                                ${state.answers.map((a, i) => `
                                    <div class="result-item ${a.cor ? 'result-correct' : 'result-wrong'}">
                                        <div style="font-weight: 700; font-size: 1.125rem; margin-bottom: 8px;">${i + 1}. ${a.q}</div>
                                        <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
                                            <span style="color: ${a.cor ? '#16a34a' : '#dc2626'};">Sizning javob: ${a.u}</span>
                                            ${!a.cor ? `<span style="color: #16a34a;">Togri: ${a.a}</span>` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <button class="btn btn-primary" onclick="handleGoToMap()">Map</button>
                        </div>
                    </div>
                `;
            } else {
                const av = avs[state.player.s];
                app.innerHTML = `
                    <div class="gradient-bg">
                        <div class="header">
                            <div class="header-content">
                                <div style="display: flex; align-items: center; gap: 16px;">
                                    <div class="avatar" style="background-color: ${av.c};">${av.e}</div>
                                    <div>
                                        <div style="color: white; font-weight: 700; font-size: 1.5rem;">${state.player.n}</div>
                                        <div style="color: #fde047; font-size: 1.125rem; font-weight: 600;">Lvl ${state.player.l}</div>
                                    </div>
                                </div>
                                <div class="stats">
                                    <div class="stat-badge">⭐ ${state.player.c}</div>
                                    <div class="stat-badge">⚡ ${state.player.x}</div>
                                    <div class="stat-badge">🔋 ${state.player.e}</div>
                                    <button class="stat-badge" onclick="handleLogout()" style="cursor: pointer; background: rgba(239, 68, 68, 0.8);">🚪</button>
                                </div>
                            </div>
                        </div>
                        <div class="nav">
                            <div class="nav-buttons">
                                <button class="nav-btn ${state.screen === 'map' ? 'active' : ''}" onclick="handleNav('map')">🗺️ Map</button>
                                <button class="nav-btn ${state.screen === 'rank' ? 'active' : ''}" onclick="handleNav('rank')">📈 Reyting</button>
                                <button class="nav-btn ${state.screen === 'shop' ? 'active' : ''}" onclick="handleNav('shop')">🛍️ Dokon</button>
                                <button class="nav-btn ${state.screen === 'prof' ? 'active' : ''}" onclick="handleNav('prof')">👤 Profil</button>
                            </div>
                        </div>
                        <div class="container">
                            ${state.screen === 'map' ? renderMap() : ''}
                            ${state.screen === 'rank' ? renderRank() : ''}
                            ${state.screen === 'shop' ? renderShop() : ''}
                            ${state.screen === 'prof' ? renderProf() : ''}
                        </div>
                        ${state.message ? `<div class="message">${state.message}</div>` : ''}
                    </div>
                `;
            }
        }

        function renderMap() {
            return `
                <h2 style="font-size: 3rem; font-weight: 700; color: white; margin-bottom: 40px; text-align: center;">Fanlar 🗺️</h2>
                <div class="grid grid-2">
                    ${Object.entries(subs).map(([sid, sub]) => `
                        <div class="card">
                            <div class="text-center mb-6">
                                <div style="font-size: 5rem; margin-bottom: 16px;">${sub.e}</div>
                                <h3 style="font-size: 2rem; font-weight: 700; color: ${sub.c};">${sub.n}</h3>
                            </div>
                            <div class="grid-5">
                                ${[...Array(10)].map((_, i) => {
                                    const l = i + 1;
                                    const id = `${sid}-${l}`;
                                    const done = state.player.d.includes(id);
                                    const lock = i > 0 && !state.player.d.includes(`${sid}-${i}`);
                                    return `
                                        <button 
                                            class="level-btn" 
                                            onclick="handleStart('${sid}', ${l})"
                                            ${lock ? 'disabled' : ''}
                                            style="
                                                ${done ? 'background: #22c55e; border-color: #16a34a; color: white;' : lock ? 'background: #d1d5db; color: #9ca3af; border-color: #9ca3af;' : `background: ${sub.c}; border-color: ${sub.c}; color: white;`}
                                            ">
                                            ${done ? '✅' : lock ? '🔒' : l}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div style="text-align: center; margin-top: 32px;">
                    <button class="btn" onclick="handleBuyEnergy()" style="max-width: 400px; background: linear-gradient(135deg, #10b981, #059669); color: white; font-size: 1.5rem;">
                        ⚡ Energiya (100 coin)
                    </button>
                </div>
            `;
        }

        function renderRank() {
            return `
                <div style="max-width: 600px; margin: 0 auto;">
                    <h2 style="font-size: 3rem; font-weight: 700; color: white; margin-bottom: 40px; text-align: center;">🏆 Reyting</h2>
                    ${state.board.map((u, i) => `
                        <div class="card mb-4" style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-weight: 700; display: flex; gap: 12px; align-items: center; color: #667eea;">
                                <span style="font-size: 1.875rem;">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}</span>
                                <span style="font-size: 1.25rem;">${u.n}</span>
                            </span>
                            <div style="text-align: right;">
                                <div style="font-size: 1.5rem; font-weight: 900; color: #667eea;">${u.x} XP</div>
                                <div style="font-size: 0.875rem; font-weight: 600; color: #6b7280;">Lvl ${u.l}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderShop() {
            return `
                <h2 style="font-size: 3rem; font-weight: 700; color: white; margin-bottom: 40px; text-align: center;">Dokon 🛍️</h2>
                <div class="grid grid-4">
                    ${Object.entries(avs).map(([id, a]) => {
                        const own = state.player.sk.includes(id);
                        const eq = state.player.s === id;
                        return `
                            <div class="card ${eq ? 'ring-4 ring-yellow-400' : ''}" style="${eq ? 'box-shadow: 0 0 0 4px #facc15;' : ''}">
                                <div style="font-size: 5rem; margin-bottom: 16px; text-align: center; padding: 24px; border-radius: 16px; background-color: ${a.c};">${a.e}</div>
                                <h3 style="font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 8px; color: ${a.c};">${a.n}</h3>
                                ${a.p ? `<div style="text-align: center; margin-bottom: 16px; font-weight: 700; color: #d97706;">${a.p} ⭐</div>` : ''}
                                ${eq ? '<div style="background: #22c55e; color: white; padding: 12px; border-radius: 50px; text-align: center; font-weight: 700;">✅ Taqilgan</div>' :
                                own ? `<button class="btn btn-primary" onclick="handleEquip('${id}')">Taqish</button>` :
                                `<button class="btn" onclick="handleBuy('${id}')" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: white;">Olish</button>`}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderProf() {
            const av = avs[state.player.s];
            return `
                <div style="max-width: 600px; margin: 0 auto;">
                    <h2 style="font-size: 3rem; font-weight: 700; color: white; margin-bottom: 40px; text-align: center;">Profil 👤</h2>
                    <div class="card">
                        <div style="font-size: 6rem; text-align: center; margin-bottom: 24px; padding: 32px; border-radius: 24px; background-color: ${av.c};">${av.e}</div>
                        ${[
                            { l: 'Ism', v: state.player.n },
                            { l: 'Yosh', v: state.player.a },
                            { l: 'Level', v: state.player.l },
                            { l: 'Coins', v: state.player.c },
                            { l: 'XP', v: state.player.x },
                            { l: 'Energiya', v: state.player.e },
                            { l: 'Tugallandi', v: `${state.player.d.length}/40` }
                        ].map(x => `
                            <div style="display: flex; justify-content: space-between; background: #f9fafb; padding: 16px; border-radius: 16px; border: 1px solid #e5e7eb; margin-bottom: 16px;">
                                <span style="font-weight: 700; color: #374151;">${x.l}:</span>
                                <span style="font-size: 1.5rem; font-weight: 700; color: #667eea;">${x.v}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Event handlers
        function handleLogin() {
            login();
        }

        function handleRegister() {
            register();
        }

        function handleToggleReg() {
            state.isReg = !state.isReg;
            state.error = '';
            state.form = { u: '', p: '', p2: '', a: '' };
            render();
        }

        function handleStart(sid, l) {
            start(sid, l);
        }

        function handleCheck(sel) {
            check(sel);
        }

        function handleGoToMap() {
            state.screen = 'map';
            render();
        }

        function handleNav(screen) {
            state.screen = screen;
            render();
        }

        function handleLogout() {
            logout();
        }

        function handleBuyEnergy() {
            buyEnergy();
        }

        function handleBuy(id) {
            buyAvatar(id);
        }

        function handleEquip(id) {
            equipAvatar(id);
        }

        // Initialize
        loadBoard();
        render();
    </script>
</body>
</html>
